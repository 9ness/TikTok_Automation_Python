# APK de la app (WebView).
#
# Sustituye a la TWA. El porqué está en APK.md: una TWA delega las descargas en
# Chrome, y desde ahí no se puede ni elegir carpeta ni subir en segundo plano —
# que es justo lo que hace falta cuando se bajan diez vídeos de una tanda o se
# suben los clips de ocho productos seguidos. El workflow de la TWA sigue en
# `android-apk-twa.yml` por si hay que volver atrás.
#
# Se instala ENCIMA de la anterior porque comparte `applicationId` y clave de
# firma. Lo que NO se conserva es la sesión: la TWA guardaba las cookies en
# Chrome y el WebView tiene su propio almacén, así que la primera vez hay que
# volver a entrar con el PIN.
#
# Se lanza a mano: Actions → "APK (app)" → Run workflow.

name: APK (app)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # La app compara su `versionCode` con el que va en las notas de la
      # release para avisar de que hay una nueva. Si se publicara una APK cuyo
      # `versionCode` no ha subido, Android se negaría a instalarla encima y el
      # aviso no llegaría nunca: mejor parar aquí.
      - name: Sacar el versionCode
        id: version
        run: |
          CODE=$(grep -oP 'versionCode\s+\K\d+' android-app/app/build.gradle | head -1)
          NAME=$(grep -oP 'versionName\s+"\K[^"]+' android-app/app/build.gradle | head -1)
          if [ -z "$CODE" ] || [ -z "$NAME" ]; then
            echo "::error::No encuentro versionCode/versionName en android-app/app/build.gradle"
            exit 1
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Construyendo la $NAME (versionCode $CODE)"

      - name: Comprobar que el versionCode ha subido
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBLICADO=$(gh release view apk-latest --json body -q .body 2>/dev/null \
                      | grep -oP 'versionCode=\K\d+' || echo 0)
          if [ "${{ steps.version.outputs.code }}" -le "$PUBLICADO" ]; then
            echo "::error::versionCode ${{ steps.version.outputs.code }} no supera al publicado ($PUBLICADO). Súbelo en android-app/app/build.gradle."
            exit 1
          fi
          echo "OK: $PUBLICADO -> ${{ steps.version.outputs.code }}"

      # La keystore va versionada a propósito (mismo criterio que en
      # planificador-viajes y fitness-life): es autofirmada y solo sirve para
      # instalar de lado. Aquí ADEMÁS es lo que permite instalar encima de la
      # TWA sin desinstalarla: si cambiara la clave, Android lo rechazaría.
      - name: Construir y firmar
        working-directory: android-app
        run: gradle --no-daemon assembleRelease

      - name: Renombrar
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk tiktok-auto.apk
          ls -la tiktok-auto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-auto-apk
          path: tiktok-auto.apk
          if-no-files-found: error

      # Enlace fijo: la propia app manda aquí cuando avisa de que hay versión
      # nueva, así que la etiqueta NO puede cambiar de nombre.
      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest tiktok-auto.apk \
            --title "TikTok Auto ${{ steps.version.outputs.name }}" \
            --notes "versionCode=${{ steps.version.outputs.code }}

          Descarga \`tiktok-auto.apk\` y ábrela para instalar. Se pone encima de la que ya tienes.
          La primera vez pedirá el PIN otra vez."
