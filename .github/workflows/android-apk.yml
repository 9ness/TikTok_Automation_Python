# Genera la APK de la app (TWA — Trusted Web Activity).
#
# Por qué TWA y no Capacitor: una TWA no es un WebView, es Chrome con la barra
# oculta. Eso importa aquí porque media app son DESCARGAS (fotos de fichas,
# vídeos montados) y dentro de un WebView el `<a download>` no baja nada — no
# hay gestor de descargas. En la TWA funcionan igual que en el navegador.
#
# No empaqueta la web: la APK abre https://<host>, así que cada deploy actualiza
# la app sola y no hay que reinstalar nada. Solo hay que volver a generarla si
# cambia el dominio, el icono o el nombre.
#
# Se lanza a mano: Actions → "Build Android APK" → Run workflow.

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Dominio de la web (sin https://). Vacío = el de android/twa-manifest.json"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Instalar Bubblewrap
        run: npm i -g @bubblewrap/cli@latest

      - name: Apuntar Bubblewrap al JDK y al SDK del runner
        # Sin esto se descarga su propio JDK/SDK y el build tarda el triple (o
        # falla si el mirror está caído). El fichero de config es su única vía.
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<JSON
          { "jdkPath": "$JAVA_HOME", "androidSdkPath": "$ANDROID_SDK_ROOT" }
          JSON
          cat ~/.bubblewrap/config.json

      - name: Cambiar de dominio si se pidió
        if: inputs.host != ''
        run: |
          cd android
          python3 - <<'PY'
          import json, os
          host = os.environ["HOST"]
          m = json.load(open("twa-manifest.json"))
          viejo = m["host"]
          for k, v in m.items():
              if isinstance(v, str) and viejo in v:
                  m[k] = v.replace(viejo, host)
          m["host"] = host
          json.dump(m, open("twa-manifest.json", "w"), indent=2)
          print("host →", host)
          PY
        env:
          HOST: ${{ inputs.host }}

      - name: Comprobar que la web responde
        # Bubblewrap descarga el manifest y los iconos del dominio. Si el
        # servidor está apagado o el Funnel caído, falla con un error críptico
        # a mitad del build; mejor decirlo aquí y en claro.
        run: |
          HOST=$(python3 -c "import json;print(json.load(open('android/twa-manifest.json'))['host'])")
          echo "comprobando https://$HOST/manifest.json"
          curl -fsS --max-time 30 "https://$HOST/manifest.json" > /dev/null \
            || { echo "::error::No se pudo leer https://$HOST/manifest.json — ¿está el servidor encendido y el Funnel activo?"; exit 1; }

      - name: Generar el proyecto Android
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Construir y firmar la APK
        working-directory: android
        env:
          # La keystore va versionada a propósito (mismo criterio que en
          # planificador-viajes y fitness-life): es autofirmada y solo sirve
          # para instalar de lado. Lo que NO puede cambiar es la huella, porque
          # está en /.well-known/assetlinks.json y es lo que quita la barra de
          # direcciones. Si se regenera la clave, hay que actualizar ese fichero.
          BUBBLEWRAP_KEYSTORE_PASSWORD: tiktokauto
          BUBBLEWRAP_KEY_PASSWORD: tiktokauto
        run: |
          bubblewrap build --skipPwaValidation
          ls -la *.apk

      - name: Renombrar
        working-directory: android
        run: mv app-release-signed.apk tiktok-auto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-auto-apk
          path: android/tiktok-auto.apk

      - name: Publicar en la release "apk-latest"
        # Enlace estable para descargar siempre la última desde el móvil.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest android/tiktok-auto.apk \
            --title "APK (última)" \
            --notes "TWA de $(python3 -c "import json;print(json.load(open('android/twa-manifest.json'))['host'])"). Descarga e instala permitiendo orígenes desconocidos."
