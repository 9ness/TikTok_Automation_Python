plugins { id "com.android.application" }

android {
    namespace "ai.nebulabs.tiktok.prueba"
    compileSdk 34

    defaultConfig {
        // DISTINTO del de la app buena: así se instalan las dos a la vez y se
        // pueden comparar sin desinstalar nada.
        applicationId "ai.nebulabs.tiktok.prueba"
        minSdk 29          // MediaStore con RELATIVE_PATH, sin permisos.
        targetSdk 34
        versionCode 1
        versionName "prueba"
    }

    buildTypes {
        // Solo `debug`: es una prueba de sideload, no va a ninguna tienda.
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Solo para el "deslizar para recargar": un WebView no lo trae, lo pone
    // Chrome. Es la única dependencia del experimento.
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}
