# docker-compose.yml — TikTok Automation (FastAPI + Next.js + Caddy)
#
# Convive con la instalación systemd actual (Streamlit) sin pisarla:
# este stack solo expone los puertos del container (no del host) y todo
# pasa por Caddy en :80/:443.
#
# Uso:
#   docker compose --env-file .env up -d --build
#
# Logs:
#   docker compose logs -f api web caddy
#
# Variables clave en .env:
#   DOMAIN                           — dominio público (HTTPS auto). Vacío → solo HTTP local.
#   PUBLIC_API_URL / PUBLIC_WS_URL   — URLs que el bundle Next.js inlinea (build-time).
#   API_KEY (opcional)
#   UPSTASH_REDIS_REST_URL / TOKEN
#   ATLASCLOUD_API_KEY / GOOGLE_GEMINI_KEY_* / MINIMAX_API_KEY / ...
#   DRIVE_PATH                       — carpeta en el host con rclone Drive montado
#                                      (default ./drive_mount, no rompe en dev local).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: tiktok-api:latest
    container_name: tiktok-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Forzar host/port correctos dentro del container, independientes de .env.
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      # CORS abierto al dominio público (Caddy reescribe Origin).
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000,http://localhost,https://${DOMAIN:-localhost}}
      # temp_work y api_uploads viven dentro del volumen persistido.
      API_TEMP_ROOT: "/app/temp_work"
      # Paths de assets DENTRO del container — el `.env` del host puede tener
      # `/home/nebulabsai/gdrive/...` (path absoluto del host) pero ahí dentro
      # solo existe `/mnt/drive`. Estos overrides ganan al `env_file`.
      TIKTOK_ROOT_PATH: "/mnt/drive/NEBULABS_AUTOMATED_TIKTOK/TIKTOK_CR/TIKTOK_ASSETS"
      TIKTOK_SHOP_ROOT_PATH: "/mnt/drive/NEBULABS_AUTOMATED_TIKTOK/TIKTOK_SHOP"
      # TIKTOK_EDITOR aún no existe en Drive — la app la crea lazy como
      # hermana de TIKTOK_CR/TIKTOK_SHOP la primera vez que se crea un
      # usuario (vía `resolve_editor_root` → `ensure_user_folders`).
      TIKTOK_EDITOR_ROOT_PATH: "/mnt/drive/NEBULABS_AUTOMATED_TIKTOK/TIKTOK_EDITOR"
      # Service Account de Google Drive — necesario para compartir
      # carpetas entrada/salida con emails desde el panel del usuario.
      # El archivo JSON real lo coloca el operador en `secrets/google-sa.json`
      # del host (no se sube a git — está en .gitignore).
      GOOGLE_SA_KEY_PATH: "/app/secrets/google-sa.json"
    volumes:
      - api_temp:/app/temp_work
      # Drive sincronizado (rclone mount en el host) → necesario para los
      # pipelines que leen TIKTOK_CR/TIKTOK_SHOP. `rshared` es CRÍTICO para
      # que las subrutas del FUSE mount de rclone se vean dentro del
      # container (sin esto, el bind muestra el dir vacío inicial).
      - type: bind
        source: ${DRIVE_PATH:-./drive_mount}
        target: /mnt/drive
        bind:
          propagation: rshared
      # Host data read-only para los endpoints de diagnóstico (deploy.log,
      # deploy_status.json, queue_state.json, git HEAD, VERSION). Sin esto
      # el panel solo verá los datos del propio container (build snapshot).
      - ./temp_work:/host_data/temp_work:ro
      - ./logs:/host_data/logs:ro
      - ./.git:/host_data/.git:ro
      - ./VERSION:/host_data/VERSION:ro
      # Service Account JSON — read-only, solo el container `api` lo lee.
      # La carpeta puede no existir en dev local: si falla el mount, los
      # endpoints de sharing devolverán 503 "no configurado" (manejado en
      # `drive_sharing.is_configured()`).
      - ./secrets:/app/secrets:ro
    networks:
      - app-network
    # Permite al container llamar al host (donde corre `webhook_listener.py`
    # en :9000). El router `src/api/routers/deploy.py` proxea hacia
    # `http://host.docker.internal:9000` para alimentar el panel Deploy
    # de Settings. En Linux Docker `host-gateway` resuelve al bridge IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    # Graceful shutdown: cuando `docker compose up -d --force-recreate api`
    # (o el deploy) recrea el container, docker manda SIGTERM y espera
    # hasta este timeout antes de SIGKILL. El proceso api lo captura en
    # `lifespan` y llama a `JobQueue.start_draining()` + `wait_for_drain()`
    # — los workers terminan el job en curso, salen limpios, el proceso
    # exit, y solo entonces docker arranca el container nuevo. 30 minutos
    # cubre los jobs más largos (Atlas Standard saturado). Si los jobs
    # no terminan en 30min, docker hace SIGKILL como hard limit (último
    # recurso para no bloquear el deploy indefinidamente).
    stop_grace_period: 1800s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time: estos valores quedan inlineados en el bundle JS del cliente.
        # Para cambiarlos hay que rebuild.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_API_KEY: ${API_KEY:-}
    image: tiktok-web:latest
    container_name: tiktok-web
    restart: unless-stopped
    networks:
      - app-network
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: tiktok-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - api
      - web

volumes:
  api_temp:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
